- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- id: session-title-llm
  disabled: true
- id: llm-retry
  disabled: true
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      ollama-cloud:
        retryPolicy:
          mode: normal
          maxRetries: 0
- insert:
    - id: knowledge-pilot-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: intake-knowledge-pilot
    - id: preset-intake-knowledge-pilot
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: intake-knowledge-pilot
        plugins:
          - id: intake-knowledge-readonly
            name: /home/kiyama/.dsh/profiles/web/node_modules/@local/dsh-intake-knowledge-reader/readonly.mjs
            config:
              aistoreExecutable: /data/softwares/slack-intake/cli/bin/aistore
              storeRoot: /data/references/AI
              scopeFile: /home/kiyama/.local/state/slack-intake/stores/a5165b4bace493c40601809b87dd7dbec2d16d00ce3ea957d52608bf1afd209a/knowledge/scope.json
    - id: knowledge-one-question-pilot
      name: /data/softwares/slack-intake/integrations/dsh-intake-knowledge/tests/pilot.mjs
      config:
        presetId: intake-knowledge-pilot
        cwd: /data/softwares/slack-intake
        packetPath: !!js process.env.INTAKE_KNOWLEDGE_PILOT_PACKET
