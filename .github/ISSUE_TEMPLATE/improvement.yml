name: 困りごと・改善提案
description: 不具合・機能要望・開発手順の改善を受け付けます。困ったことだけでも投稿できます。
body:
  - type: markdown
    attributes:
      value: |
        人間・AI共通の入口です。最初の「困りごと」だけで投稿できます。他の項目は分かる範囲で構いません。解決策や設計案は不要です。

        このリポジトリのプラグイン・プリセット・スキル・開発手順などが対象です。DSH本体や他プロジェクト固有の問題は、その管理先へ報告してください。
        起票前に終了済みも含めて似たIssueやPRを検索し、同じ課題なら既存Issueに追記してください。詳しくは[参加ガイド](https://github.com/kkiyama117/deepseek-harness-plugins/blob/main/CONTRIBUTING.md)を参照してください。

        本文・添付・リンクは公開されます。認証情報・個人情報・非公開プロジェクト名・私的な会話・内部URL・生ログは載せず、公開できる最小限の再現例や要約にしてください。

        AIは観測した事実と原因の仮説を区別し、確認できていないことは「不明」「未確認」と書いてください。起票を実装・push・配備などの実行許可とは扱わないでください。
  - type: textarea
    id: problem
    attributes:
      label: 何をしようとして、どこで困りましたか？
      description: 不具合なら実際に起きたこと、機能要望なら使いたい場面、手順の改善なら詰まった工程を書いてください。短い説明で構いません。
      placeholder: 対象のプラグインやスキルなどと、何をしようとして困ったかを教えてください。
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 種類（分かれば）
      options:
        - 未整理・相談
        - 機能要望
        - 不具合
        - 共通の開発手順・スキルの改善
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: どうなればよいですか？
      description: 期待する結果や、改善したと確認できる条件を書いてください。
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: 再現方法・環境・関連リンク（あれば）
      description: 不具合は再現手順や発生頻度、機能要望は利用例、手順の改善は現在の手順が参考になります。分かる部分だけ、公開可能な情報で補足してください。
      placeholder: |
        対象・環境：パッケージやスキルの名前・版、必要ならDSHの版やOS
        手順・利用例：行った操作やコマンド、または使いたい場面
        影響：どの操作や利用者が困るか、回避方法があるか
        関連リンク：公開Issue・PR・ドキュメントなど
    validations:
      required: false
