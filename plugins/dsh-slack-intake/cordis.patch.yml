# Standalone authentication/CLI bundle: do not stack over dsh-base or another application.
- insert:
    - id: aistore-credentials
      name: '@deepseek-ai/dsh-credentials-local'
      config:
        watch: false
    - id: aistore-adapter
      name: '@kkiyama117/dsh-slack-intake'
      # Override these fields in the profile patch, or supply these non-secret variables.
      config:
        aistoreExecutable: !!js process.env.DSH_AISTORE_EXECUTABLE
        storeRoot: !!js process.env.DSH_AISTORE_STORE_ROOT
